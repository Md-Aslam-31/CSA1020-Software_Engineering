apiVersion: v1
kind: ServiceAccount
metadata:
  name: sprouthouse-dashboard
  namespace: sprouthouse-exp18
automountServiceAccountToken: false
---
# The web UI can inspect this project, but cannot edit workloads or read Secrets.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sprouthouse-dashboard-view
  namespace: sprouthouse-exp18
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "endpoints", "events", "persistentvolumeclaims", "configmaps", "serviceaccounts"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets", "controllerrevisions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sprouthouse-dashboard-view
  namespace: sprouthouse-exp18
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sprouthouse-dashboard-view
subjects:
  - kind: ServiceAccount
    name: sprouthouse-dashboard
    namespace: sprouthouse-exp18
---
# Navigation metadata only. No cluster-wide workload or Secret access.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sprouthouse-dashboard-metadata
rules:
  - apiGroups: [""]
    resources: ["namespaces", "nodes", "persistentvolumes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses", "csidrivers", "csinodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sprouthouse-dashboard-metadata
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sprouthouse-dashboard-metadata
subjects:
  - kind: ServiceAccount
    name: sprouthouse-dashboard
    namespace: sprouthouse-exp18
