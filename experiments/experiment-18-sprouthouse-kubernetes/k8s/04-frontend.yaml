apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: sprouthouse-exp18
  labels:
    app: sprouthouse
    tier: frontend
spec:
  type: NodePort
  selector:
    app: sprouthouse
    tier: frontend
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30180
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: sprouthouse-exp18
  labels:
    app: sprouthouse
    tier: frontend
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels:
      app: sprouthouse
      tier: frontend
  template:
    metadata:
      labels:
        app: sprouthouse
        tier: frontend
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsUser: 101
        runAsGroup: 101
        runAsNonRoot: true
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: sprouthouse-frontend:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet: {path: /healthz, port: http}
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests: {cpu: "25m", memory: "32Mi"}
            limits: {cpu: "200m", memory: "96Mi"}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 16Mi}
        - name: cache
          emptyDir: {sizeLimit: 16Mi}
        - name: run
          emptyDir: {sizeLimit: 1Mi}
