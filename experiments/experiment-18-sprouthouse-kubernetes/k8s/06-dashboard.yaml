# This kubeconfig contains file references, not a bearer token. The projected
# namespace-scoped service-account token is refreshed by Kubernetes server-side.
apiVersion: v1
kind: ConfigMap
metadata:
  name: sprouthouse-dashboard-config
  namespace: sprouthouse-exp18
data:
  kubeconfig: |
    apiVersion: v1
    kind: Config
    clusters:
      - name: sprouthouse-exp18
        cluster:
          server: https://kubernetes.default.svc
          certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    users:
      - name: sprouthouse-dashboard
        user:
          tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
    contexts:
      - name: SproutHouse-Lab
        context:
          cluster: sprouthouse-exp18
          namespace: sprouthouse-exp18
          user: sprouthouse-dashboard
    current-context: SproutHouse-Lab
---
apiVersion: v1
kind: Service
metadata:
  name: headlamp
  namespace: sprouthouse-exp18
  labels:
    app: sprouthouse
    tier: dashboard
spec:
  type: NodePort
  selector:
    app: sprouthouse
    tier: dashboard
  ports:
    - name: http
      port: 4466
      targetPort: http
      nodePort: 30181
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: headlamp
  namespace: sprouthouse-exp18
  labels:
    app: sprouthouse
    tier: dashboard
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: sprouthouse
      tier: dashboard
  template:
    metadata:
      labels:
        app: sprouthouse
        tier: dashboard
    spec:
      serviceAccountName: sprouthouse-dashboard
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-dashboard-assets
          image: ghcr.io/headlamp-k8s/headlamp:v0.46.0@sha256:8a0ef97527544baa2b35825940ddf4db6e2d09c30cd5aa31fd269ff604cc8b75
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args: ["cp -R /headlamp/frontend/. /runtime-frontend/"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: "25m", memory: "32Mi"}
            limits: {cpu: "200m", memory: "128Mi"}
          volumeMounts:
            - name: dashboard-frontend
              mountPath: /runtime-frontend
      containers:
        - name: headlamp
          image: ghcr.io/headlamp-k8s/headlamp:v0.46.0@sha256:8a0ef97527544baa2b35825940ddf4db6e2d09c30cd5aa31fd269ff604cc8b75
          imagePullPolicy: IfNotPresent
          command: ["/headlamp/headlamp-server"]
          args:
            - "-kubeconfig=/etc/headlamp/kubeconfig"
            - "-html-static-dir=/runtime-frontend"
            - "-plugins-dir=/headlamp/plugins"
            - "-enable-helm=false"
            - "-enable-dynamic-clusters=false"
            - "-allow-kubeconfig-changes=false"
            - "-cache-enabled=false"
          env:
            - name: HOME
              value: /tmp
            - name: XDG_CONFIG_HOME
              value: /tmp/.config
          ports:
            - name: http
              containerPort: 4466
          startupProbe:
            httpGet: {path: /, port: http}
            failureThreshold: 60
            periodSeconds: 2
            timeoutSeconds: 3
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          resources:
            requests: {cpu: "100m", memory: "96Mi", ephemeral-storage: "100Mi"}
            limits: {cpu: "500m", memory: "256Mi", ephemeral-storage: "768Mi"}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: dashboard-config
              mountPath: /etc/headlamp
              readOnly: true
            - name: dashboard-auth
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
            - name: dashboard-frontend
              mountPath: /runtime-frontend
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: dashboard-config
          configMap:
            name: sprouthouse-dashboard-config
        - name: dashboard-auth
          projected:
            defaultMode: 420
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
        - name: dashboard-frontend
          emptyDir: {sizeLimit: 256Mi}
        - name: tmp
          # Headlamp stages plugin/configuration files under HOME=/tmp. Leave
          # room for that real runtime usage in addition to the frontend volume.
          emptyDir: {sizeLimit: 256Mi}
