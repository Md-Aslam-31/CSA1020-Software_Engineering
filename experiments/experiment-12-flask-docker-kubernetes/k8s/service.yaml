apiVersion: v1
kind: Service
metadata:
  name: parcelpilot-nodeport
  namespace: parcelpilot-lab
  labels:
    app.kubernetes.io/name: parcelpilot-api
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: parcelpilot-api
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30088
  sessionAffinity: None
